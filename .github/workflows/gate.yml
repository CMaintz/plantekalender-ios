name: gate
on: { pull_request: {}, push: { branches: [main] } }
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }
jobs:
  # macOS so one job covers both the package verbs and the SwiftUI app, which needs Xcode.
  # The job name matches the other Foundry repos so branch protection can require it.
  gate:
    name: Deterministic gate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5
        with:
          version: '2026.9.4'
      - run: mise run gate
      - run: mise run app:build
