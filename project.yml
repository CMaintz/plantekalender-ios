# XcodeGen spec: CI generates Plantekalender.xcodeproj from this, so no .pbxproj is checked in.
name: Plantekalender
options:
  bundleIdPrefix: dk.cmaintz
  deploymentTarget:
    iOS: "17.0"
packages:
  PlantekalenderKit:
    path: .
targets:
  Plantekalender:
    type: application
    platform: iOS
    sources: [App]
    scheme: {}
    dependencies:
      - package: PlantekalenderKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.cmaintz.plantekalender
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Plantekalender
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        # Debug talks to a local development server on the Mac running the simulator; Release to
        # the deployed app. Each has its own Info.plist, because XcodeGen's `info:` writes one plist
        # for all configs and only Debug may talk plain HTTP to that server (NSAllowsLocalNetworking).
        Debug:
          API_BASE_URL: "http://localhost:5173"
          INFOPLIST_FILE: Support/Info-Debug.plist
        Release:
          API_BASE_URL: "https://plantekalender.cmaintz-site.workers.dev"
          INFOPLIST_FILE: Support/Info.plist
