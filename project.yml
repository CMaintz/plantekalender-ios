# XcodeGen spec: CI generates Plantekalender.xcodeproj from this, so no .pbxproj is checked in.
name: Plantekalender
options:
  bundleIdPrefix: dk.cmaintz
  deploymentTarget:
    iOS: "17.0"
packages:
  PlantekalenderKit:
    path: .
targets:
  Plantekalender:
    type: application
    platform: iOS
    sources: [App]
    scheme: {}
    dependencies:
      - package: PlantekalenderKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.cmaintz.plantekalender
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Plantekalender
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        # Debug talks to a local development server on the Mac running the simulator; Release to
        # the deployed app.
        Debug:
          API_BASE_URL: "http://localhost:5173"
        Release:
          API_BASE_URL: "https://plantekalender.cmaintz-site.workers.dev"
    info:
      path: App/Info.plist
      properties:
        APIBaseURL: $(API_BASE_URL)
        NSAppTransportSecurity:
          # Plain HTTP only to localhost, for the Debug build's dev server.
          NSAllowsLocalNetworking: true
